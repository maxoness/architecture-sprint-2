name: "sharding-repl-cache"
services:
  #сервер конфигурации
  configSrv:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: configSrv
    restart: always
    ports:
      - "27017:27017"
    networks:
      app-network:
        ipv4_address: 173.17.0.10
    volumes:
      - config-data-max:/data/db
    command:
      [
        "--configsvr",
        "--replSet",
        "config_server",
        "--bind_ip_all",
        "--port",
        "27017"
      ]
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  #mongos_router1
  mongos_router1:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: mongos_router1
    depends_on:
      shard1-1: 
        condition: service_started
    restart: always
    ports:
      - "27025:27025"
    networks:
      app-network:
        ipv4_address: 173.17.0.12
    command:
       [
         "mongos", 
         "--configdb", 
         "config_server/configSrv:27017",
         "--bind_ip_all",
         "--port",
         "27025"
       ]
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - mongos_router1-data-max:/data/db

  #shard1-1
  shard1-1:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard1-1
    restart: always
    ports:
      - "27018:27018"
    networks:
      app-network:
        ipv4_address: 173.17.0.2
    volumes:
      - shard1-1-data-max:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "ReplicaSet1",
        "--bind_ip_all",
        "--port",
        "27018"
      ]
    depends_on:
      - configSrv
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  #shard1-2
  shard1-2:
    container_name: shard1-2
    image: dh-mirror.gitverse.ru/mongo:latest
    restart: always
    ports:
      - "27019:27019"
    networks:
      app-network:
        ipv4_address: 173.17.0.3
    volumes:
      - shard1-2-data-max:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "ReplicaSet1",
        "--bind_ip_all",
        "--port",
        "27019"
      ]
    depends_on:
      - configSrv
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  #shard1-3
  shard1-3:
    container_name: shard1-3
    image: dh-mirror.gitverse.ru/mongo:latest
    restart: always
    ports:
      - "27020:27020"
    networks:
      app-network:
        ipv4_address: 173.17.0.4
    volumes:
      - shard1-3-data-max:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "ReplicaSet1",
        "--bind_ip_all",
        "--port",
        "27020"
      ]
    depends_on:
      - configSrv
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  #mongos_router2
  mongos_router2:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: mongos_router2
    depends_on:
      shard2-1: 
        condition: service_started
    restart: always
    ports:
      - "27021:27021"
    networks:
      app-network:
        ipv4_address: 173.17.0.5
    command:
       [
         "mongos", 
         "--configdb", 
         "config_server/configSrv:27017",
         "--bind_ip_all",
         "--port",
         "27021"
       ]
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - mongos_router2-data-max:/data/db

  #shard2-1
  shard2-1:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard2-1
    restart: always
    ports:
      - "27022:27022"
    networks:
      app-network:
        ipv4_address: 173.17.0.6
    volumes:
      - shard2-1-data-max:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "ReplicaSet2",
        "--bind_ip_all",
        "--port",
        "27022"
      ]
    depends_on:
      - configSrv
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  #shard2-2
  shard2-2:
    container_name: shard2-2
    image: dh-mirror.gitverse.ru/mongo:latest
    restart: always
    ports:
      - "27023:27023"
    networks:
      app-network:
        ipv4_address: 173.17.0.7
    volumes:
      - shard2-2-data-max:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "ReplicaSet2",
        "--bind_ip_all",
        "--port",
        "27023"
      ]
    depends_on:
      - configSrv
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  #shard2-3
  shard2-3:
    container_name: shard2-3
    image: dh-mirror.gitverse.ru/mongo:latest
    restart: always
    ports:
      - "27024:27024"
    networks:
      app-network:
        ipv4_address: 173.17.0.8
    volumes:
      - shard2-3-data-max:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "ReplicaSet2",
        "--bind_ip_all",
        "--port",
        "27024"
      ]
    depends_on:
      - configSrv
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  redis:
    image: "redis:latest"
    container_name: redis
    ports:
      - "6379"
    volumes:
      - redis_data_max:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    networks:
      app-network:
        ipv4_address: 173.17.0.15

  pymongo_api:
    container_name: pymongo_api
    build: 
      context: api_app
      dockerfile: Dockerfile
    image: kazhem/pymongo_api:1.0.0
    depends_on:
      mongos_router1: 
        condition: service_started
    ports:
      - 8080:8080
    networks:
      app-network:
        ipv4_address: 173.17.0.11
    environment:
      MONGODB_URL: "mongodb://mongos_router1:27025"
      MONGODB_DATABASE_NAME: "somedb"
      REDIS_URL: "redis://redis:6379"

networks:
  app-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 173.17.0.0/16    

volumes:
  config-data-max:
  shard1-1-data-max:
  shard1-2-data-max:
  shard1-3-data-max:
  shard2-1-data-max:
  shard2-2-data-max:
  shard2-3-data-max:
  mongos_router1-data-max:
  mongos_router2-data-max:
  redis_data_max: